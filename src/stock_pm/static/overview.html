<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>决策系统 · 总览</title>
  <link rel="stylesheet" href="/static/desk.css" />
  <link rel="stylesheet" href="/static/shell.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-name">决策系统</div>
        <div class="brand-meta" id="brand-meta">加载中…</div>
      </div>
      <nav class="nav-primary" aria-label="主路径">
        <a href="/" class="active">总览</a>
        <a href="/stock" id="nav-stock">个股</a>
        <a href="/review">复盘</a>
      </nav>
      <div class="nav-secondary">
        <details class="nav-drop">
          <summary>诊断/设置 ▾</summary>
          <div class="nav-menu">
            <a href="/events">事件中心</a>
            <a href="/replay">盘面回放</a>
            <a href="/settings">设置</a>
          </div>
        </details>
      </div>
    </header>
    <div class="page-head">
      <div>
        <h1 class="page-title">今天什么改变了</h1>
        <p class="page-sub">主事件置顶 · 其下「今日重点关注」三行紧凑 · 其余市场事件轮播 · 整行点进个股（无持仓）</p>
      </div>
    </div>
    <div id="desk-root"><p class="empty-note">正在加载总览…</p></div>
    <p class="sr-only">无原文链接</p>
  </div>
  <script src="/static/desk.js"></script>
  <script>
  (function () {
    var desk = window.StockPmDesk;
    desk.api("/api/desk/overview").then(function (data) {
      document.getElementById("brand-meta").textContent = data.brand_meta || "";
      var rendered = desk.renderOverview(data);
      document.getElementById("desk-root").innerHTML = rendered.html;
      var nav = document.getElementById("nav-stock");
      if (nav && rendered.stockHref) nav.href = rendered.stockHref;
      desk.bindCarousel(document.getElementById("desk-root"));
    }).catch(function (err) {
      document.getElementById("desk-root").innerHTML = '<p class="empty-note">总览暂不可用。' + desk.esc(err.message || "") + '</p>';
    });
  })();
  </script>
</body>
</html>
