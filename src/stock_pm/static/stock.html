<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stock PM · 个股详情</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/shell.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script defer src="/static/shell.js"></script>
  <script defer src="/static/events_ui.js"></script>
  <script defer src="/static/stock.js"></script>
</head>
<body>
  <header class="stock-header">
    <div class="header-inner">
      <nav class="global-nav" aria-label="主导航">
        <a class="brand" href="/">Stock PM</a>
        <a href="/">总览</a><a href="/events">事件中心</a><a href="/replay">盘面回放</a><a href="/review">复盘</a><a href="/settings">设置</a>
      </nav>
      <div class="symbol-tools">
        <label for="symbol-switcher">切换标的</label>
        <select id="symbol-switcher" aria-label="切换标的"><option>加载中…</option></select>
      </div>
      <div class="instrument">
        <div>
          <div class="symbol-line"><strong id="symbol">—</strong><span id="name">加载中…</span></div>
          <div id="metadata" class="muted">—</div>
          <div id="themes" class="chips"></div>
        </div>
        <div class="last-quote">
          <strong id="last-price">—</strong>
          <span id="price-change">—</span>
        </div>
      </div>
      <div id="quote-grid" class="quote-grid" aria-live="polite"></div>
    </div>
  </header>
  <main class="page-shell">
    <section id="decision-module" class="decision-module" aria-labelledby="decision-heading">
      <h2 id="decision-heading">动态判断</h2>
      <div id="decision-body" class="state loading"><span class="spinner"></span>正在加载动态判断…</div>
      <div id="data-health-slot"></div>
      <dialog id="fact-drawer" class="fact-drawer">
        <article id="fact-drawer-body"></article>
        <form method="dialog"><button type="submit">关闭</button></form>
      </dialog>
    </section>
    <section id="event-module" class="decision-module event-module" aria-labelledby="event-heading">
      <h2 id="event-heading">相关重大事件</h2>
      <div id="event-coverage" class="event-coverage" data-google-status="pending">加载覆盖状态…</div>
      <div id="event-body" class="state loading"><span class="spinner"></span>正在加载相关事件…</div>
    </section>
    <div id="stock-pm-shell"></div>
    <div class="tabs" role="tablist" aria-label="个股详情">
      <button role="tab" data-tab="chart">图表</button>
      <button role="tab" data-tab="review">复盘</button>
      <button role="tab" data-tab="earnings">财报</button>
      <button role="tab" data-tab="valuation">估值</button>
      <button role="tab" data-tab="flow">筹码与资金</button>
      <button role="tab" data-tab="news-options">资讯与期权</button>
    </div>
    <section id="tab-content" class="tab-content" aria-live="polite">
      <div class="state loading"><span class="spinner"></span>正在加载…</div>
    </section>
  </main>
</body>
</html>
