<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>决策系统 · 复盘</title>
  <link rel="stylesheet" href="/static/desk.css" />
  <link rel="stylesheet" href="/static/shell.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-name">决策系统</div>
        <div class="brand-meta">复盘</div>
      </div>
      <nav class="nav-primary" aria-label="主路径">
        <a href="/">总览</a>
        <a href="/stock" id="nav-stock">个股</a>
        <a href="/review" class="active">复盘</a>
      </nav>
      <div class="nav-secondary">
        <details class="nav-drop">
          <summary>诊断/设置 ▾</summary>
          <div class="nav-menu">
            <a href="/events">事件中心</a>
            <a href="/replay">盘面回放</a>
            <a href="/settings">设置</a>
          </div>
        </details>
      </div>
    </header>
    <div class="page-head">
      <div>
        <h1 class="page-title">为什么对、为什么错</h1>
        <p class="page-sub">正式预测对在哪 · 错在哪 · 新信息 · 以后怎么改</p>
      </div>
    </div>
    <div class="filter-bar">
      <strong>筛选</strong>
      <span>需复盘的正式预测（本周到期 / 已触发）</span>
      <span class="muted">· 非全市场倾倒 · 其余观察折叠</span>
    </div>
    <div id="desk-root"><p class="empty-note">正在加载复盘…</p></div>
    <p class="sr-only">无原文链接</p>
  </div>
  <script src="/static/desk.js"></script>
  <script>
  (function () {
    var desk = window.StockPmDesk;
    Promise.all([
      desk.api("/api/desk/review"),
      desk.api("/api/watchlist").catch(function () { return []; })
    ]).then(function (pair) {
      var data = pair[0];
      var watch = pair[1] || [];
      var nav = document.getElementById("nav-stock");
      if (nav && watch[0] && watch[0].symbol) nav.href = "/stock/" + encodeURIComponent(watch[0].symbol);
      document.getElementById("desk-root").innerHTML = desk.renderReview(data);
    }).catch(function (err) {
      document.getElementById("desk-root").innerHTML = '<p class="empty-note">复盘暂不可用。' + desk.esc(err.message || "") + '</p>';
    });
  })();
  </script>
</body>
</html>
