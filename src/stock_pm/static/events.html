<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stock PM · 市场事件中心</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/shell.css">
  <script defer src="/static/shell.js"></script>
  <script defer src="/static/events_ui.js"></script>
  <script defer src="/static/events.js"></script>
</head>
<body>
  <header class="stock-header">
    <div class="header-inner">
      <nav class="global-nav" aria-label="主导航">
        <a class="brand" href="/">Stock PM</a>
        <a href="/">总览</a><a class="active" href="/events">事件中心</a><a href="/replay">盘面回放</a><a href="/review">复盘</a><a href="/settings">设置</a>
      </nav>
      <div class="instrument">
        <div>
          <div class="symbol-line"><strong>市场事件中心</strong><span>可审计事件 → 因果影响</span></div>
          <div class="muted">官方事实、媒体确认、机构观点严格分离。聚合搜索只用于发现，不作为最终证据。</div>
        </div>
      </div>
    </div>
  </header>
  <main class="page-shell event-center">
    <section class="decision-module event-module" aria-labelledby="event-center-heading">
      <h2 id="event-center-heading">重大事件与影响</h2>
      <p class="subline">30 秒内应能回答：发生了什么、可信度、为何相关、影响多久、何时失效。因果链按 Fact → Change → Expectation → Impact → What changes 逐层核对原文。</p>
      <div id="event-coverage" class="event-coverage" data-google-status="pending">加载覆盖状态…</div>
      <div id="event-center" class="state loading" data-events-ready="0"><span class="spinner"></span>正在加载市场事件…</div>
    </section>
    <div id="stock-pm-shell"></div>
  </main>
</body>
</html>
