services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_pm
      POSTGRES_USER: stock_pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}
    volumes:
      - stock_pm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_pm -d stock_pm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    # Dockerfile CMD uses uvicorn --workers 2 so one blocked assemble cannot 502 /health.
    environment:
      DATABASE_URL: postgresql://stock_pm:${POSTGRES_PASSWORD}@postgres:5432/stock_pm
      DATABASE_POOL_SIZE: 8
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:?Set ALPACA_API_KEY_ID in .env.server}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:?Set ALPACA_API_SECRET_KEY in .env.server}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_BARS_FEED: ${ALPACA_BARS_FEED:-sip}
      ALPACA_OPTIONS_FEED: ${ALPACA_OPTIONS_FEED:-indicative}
      FRED_API_KEY: ${FRED_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  environment-job:
    build: .
    restart: "no"
    environment:
      DATABASE_URL: postgresql://stock_pm:${POSTGRES_PASSWORD}@postgres:5432/stock_pm
      DATABASE_POOL_SIZE: 4
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_BARS_FEED: ${ALPACA_BARS_FEED:-sip}
      ALPACA_OPTIONS_FEED: ${ALPACA_OPTIONS_FEED:-indicative}
      FRED_API_KEY: ${FRED_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m stock_pm.environment_job

volumes:
  stock_pm_postgres:
